<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RT-Translator — Streaming Client</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { font-size: 22px; }
  .row { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; margin: 16px 0; }
  label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #666; margin-bottom: 4px; }
  select, input { padding: 8px; font-size: 15px; }
  button { padding: 10px 20px; font-size: 15px; cursor: pointer; border: 1px solid #333; background: #fff; border-radius: 4px; }
  button.rec { background: #c0392b; color: #fff; border-color: #c0392b; }
  .box { border: 1px solid #ddd; border-radius: 6px; padding: 14px; margin: 10px 0; min-height: 50px; }
  .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #999; }
  #transcript { color: #333; } #translation { color: #1a6b3a; font-size: 18px; }
  .status { font-size: 13px; color: #666; }
</style>
</head>
<body>
  <h1>Real-Time Translator — streaming client</h1>
  <p class="status">Captures mic audio via WebRTC, sends 500&nbsp;ms chunks to the gateway over WebSocket, plays the translated audio back.</p>

  <div class="row">
    <div><label>Gateway</label><input id="gw" value="ws://localhost:8000" size="24"></div>
    <div><label>From</label>
      <select id="source">
        <option value="auto">Detect</option><option value="en">English</option>
        <option value="es">Spanish</option><option value="fr">French</option>
        <option value="de">German</option><option value="hi">Hindi</option>
      </select>
    </div>
    <div><label>To</label>
      <select id="target">
        <option value="es">Spanish</option><option value="en">English</option>
        <option value="fr">French</option><option value="de">German</option>
        <option value="hi">Hindi</option>
      </select>
    </div>
    <button id="toggle">● Start</button>
  </div>

  <div class="box"><div class="lbl">Transcript</div><div id="transcript">—</div></div>
  <div class="box"><div class="lbl">Translation</div><div id="translation">—</div></div>
  <div class="status" id="status">Idle</div>
  <audio id="player" autoplay></audio>

<script>
const $ = id => document.getElementById(id);
let ws = null, media = null, recorder = null, running = false;

function setStatus(t){ $("status").textContent = t; }

async function start(){
  const base = $("gw").value.replace(/\/$/, "");
  const url = `${base}/ws/translate?source=${$("source").value}&target=${$("target").value}`;
  ws = new WebSocket(url);
  ws.onopen = () => setStatus("Connected — listening");
  ws.onclose = () => setStatus("Disconnected");
  ws.onerror = () => setStatus("WebSocket error — is the gateway running?");
  ws.onmessage = ev => {
    let r;
    try {
      r = JSON.parse(ev.data);
    } catch (err) {
      setStatus("Received malformed data from server");
      console.error("JSON parse error:", err, ev.data);
      return;
    }
    console.log("Result from server:", r);
    // Show transcript/translation even if empty, so you can see it responded.
    if (typeof r.text === "string") $("transcript").textContent = r.text || "(no speech detected)";
    if (typeof r.translation === "string") $("translation").textContent = r.translation || "—";
    if (r.text || r.translation) setStatus("Got result — listening");
    if (r.audio_b64) {
      const player = $("player");
      player.src = "data:audio/wav;base64," + r.audio_b64;
      // Browsers may block autoplay; play() returns a promise we can catch.
      player.play().catch(() => setStatus("Result ready (tap page to enable audio)"));
    }
  };

  media = await navigator.mediaDevices.getUserMedia({ audio: true });

  // Record complete short clips instead of streaming fragments. MediaRecorder's
  // timeslice mode emits headerless fragments after the first chunk, which the
  // server can't decode. Instead we record a full clip, stop (which finalises a
  // valid WebM file with a header), send it, then immediately start the next.
  const CLIP_MS = 3000;   // ~3s clips: a good balance of latency vs. decodability

  function recordClip() {
    if (!running || ws.readyState !== WebSocket.OPEN) return;
    const chunks = [];
    recorder = new MediaRecorder(media, { mimeType: pickMime() });
    recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = async () => {
      const blob = new Blob(chunks, { type: recorder.mimeType });
      if (blob.size > 0 && ws.readyState === WebSocket.OPEN) {
        ws.send(await blobToB64(blob));
      }
      if (running) recordClip();   // immediately record the next clip
    };
    recorder.start();
    setTimeout(() => { if (recorder.state !== "inactive") recorder.stop(); }, CLIP_MS);
  }

  running = true;
  recordClip();
  $("toggle").textContent = "■ Stop";
  $("toggle").classList.add("rec");
}

function stop(){
  running = false;
  if (recorder && recorder.state !== "inactive") recorder.stop();
  if (media) media.getTracks().forEach(t => t.stop());
  if (ws) ws.close();
  $("toggle").textContent = "● Start";
  $("toggle").classList.remove("rec");
  setStatus("Stopped");
}

$("toggle").onclick = () => running ? stop() : start();

function pickMime(){
  const opts = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus"];
  return opts.find(m => MediaRecorder.isTypeSupported(m)) || "";
}
function blobToB64(blob){
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(",")[1]);
    r.readAsDataURL(blob);
  });
}
</script>
</body>
</html>
